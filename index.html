<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PRISM — Next-Gen AI Search & Private Hybrid Browser with interactive flowcharts, dynamic comparison tables, anti-SEO indexing, and zero ads." />
    <title>PRISM — Next-Gen AI Search & Private Hybrid Browser</title>
    <link rel="canonical" href="https://prism-search.vercel.app/" />

    <!-- Comprehensive Favicon Package -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/prism-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#6366f1" />

    <!-- Open Graph Social Media Protocol -->
    <meta property="og:site_name" content="PRISM" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prism-search.vercel.app/" />
    <meta property="og:title" content="PRISM — Next-Gen AI Search & Private Hybrid Browser" />
    <meta property="og:description" content="PRISM is a next-gen hybrid AI search engine and private browser featuring zero-SEO noise, interactive flowcharts, dynamic comparison tables, and ad-free utilities." />
    <meta property="og:image" content="https://prism-search.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PRISM — Next-Gen AI Search Engine & Private Hybrid Browser" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@prismsearch" />
    <meta name="twitter:creator" content="@prismsearch" />
    <meta name="twitter:title" content="PRISM — Next-Gen AI Search & Private Hybrid Browser" />
    <meta name="twitter:description" content="PRISM is a next-gen hybrid AI search engine and private browser featuring zero-SEO noise, interactive flowcharts, dynamic comparison tables, and ad-free utilities." />
    <meta name="twitter:image" content="https://prism-search.vercel.app/og-image.png" />

    <!-- Progressive Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PRISM" />
    
    <!-- Google Fonts: Plus Jakarta Sans, Outfit, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet Interactive Maps Engine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PRISM Service Worker registered with scope:', reg.scope))
            .catch((err) => console.warn('PRISM Service Worker registration notice:', err));
        });
      }
    </script>
  </body>
</html>
