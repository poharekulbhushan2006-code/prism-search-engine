<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="prismLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Outer Triangle -->
  <polygon points="256,76 438,396 74,396" fill="none" stroke="url(#prismLight)" stroke-width="18" filter="url(#neonGlow)"/>

  <!-- Core Facets -->
  <polygon points="256,120 400,375 112,375" fill="url(#prismLight)" opacity="0.9"/>
  <polygon points="256,190 350,355 162,355" fill="#ffffff" opacity="0.35"/>
  <circle cx="256" cy="275" r="32" fill="#ffffff" opacity="0.85" filter="url(#neonGlow)"/>

  <!-- Optical Light Beams -->
  <line x1="256" y1="76" x2="256" y2="440" stroke="#06b6d4" stroke-width="4" opacity="0.4"/>
  <line x1="74" y1="396" x2="438" y2="210" stroke="#ec4899" stroke-width="3" opacity="0.35"/>
  <line x1="438" y1="396" x2="74" y2="210" stroke="#6366f1" stroke-width="3" opacity="0.35"/>
</svg>
